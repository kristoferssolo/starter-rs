name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version number in the format v1.2.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  metadata:
    name: Resolve release
    # The cargo-generate template itself has no crate to release
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.release.outputs.name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Resolve and validate release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              version="${INPUT_VERSION#v}"
          else
              version="${REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be a valid SemVer value in the format v1.2.3"
              exit 1
          fi

          package="$(cargo metadata --no-deps --format-version 1 | jq -c '.packages[0]')"
          name="$(jq -r '.name' <<<"$package")"
          manifest_version="$(jq -r '.version' <<<"$package")"
          if [[ "$manifest_version" != "$version" ]]; then
              echo "::error::$name is version $manifest_version, not $version"
              exit 1
          fi

          # Builds use this commit, and GitHub releases an existing tag as it is
          if tag_commit="$(git rev-parse --quiet --verify "refs/tags/v$version^{commit}")" &&
              [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::v$version points to $tag_commit, not $GITHUB_SHA"
              exit 1
          fi

          {
              echo "name=$name"
              echo "tag=v$version"
              echo "version=$version"
          } >>"$GITHUB_OUTPUT"
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  # Archives follow a cargo-binstall default name, so `cargo binstall`
  # finds them without `[package.metadata.binstall]`
  build-binaries:
    name: Build ${{ needs.metadata.outputs.name }} (${{ matrix.target }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build release binary
        env:
          NAME: ${{ needs.metadata.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bin "$NAME" --target "$TARGET"
      - name: Package binary
        env:
          NAME: ${{ needs.metadata.outputs.name }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          archive="$NAME-$VERSION-$TARGET"
          mkdir -p "dist/$archive"
          install -m 0755 "target/$TARGET/release/$NAME" "dist/$archive/$NAME"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          (
              cd dist
              # macOS runners ship `shasum` rather than `sha256sum`
              if command -v sha256sum >/dev/null; then
                  sha256sum "$archive.tar.gz" >"$archive.tar.gz.sha256"
              else
                  shasum -a 256 "$archive.tar.gz" >"$archive.tar.gz.sha256"
              fi
          )
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.name }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    name: Publish to crates.io
    needs:
      - audit
      - build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
  release:
    name: Create GitHub release
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: --locked git-cliff
      - name: Generate release notes
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          # A manual run can release a tag that does not exist yet. A tag pushed since
          # the metadata job checked must still be on this commit
          if tag_commit="$(git rev-parse --quiet --verify "refs/tags/$TAG^{commit}")"; then
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                  echo "::error::$TAG points to $tag_commit, not $GITHUB_SHA"
                  exit 1
              fi
              git cliff --current --strip all --output "$NOTES_PATH"
          else
              git cliff --unreleased --tag "$TAG" --strip all --output "$NOTES_PATH"
          fi
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ${{ needs.metadata.outputs.name }}-*
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.name }} v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
